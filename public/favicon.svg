<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter for Paper -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15" />

  <!-- Examination Paper Sheet -->
  <g filter="url(#shadow)">
    <!-- Base Paper with top-right fold corner -->
    <path d="M 14 11 C 14 9.3 15.3 8 17 8 L 37 8 L 47 18 L 47 50 C 47 51.7 45.7 53 44 53 L 17 53 C 15.3 53 14 51.7 14 50 Z" fill="url(#paperGrad)" />
    <!-- Folded Corner Flap -->
    <path d="M 37 8 L 37 16 C 37 17.1 37.9 18 39 18 L 47 18 Z" fill="#cbd5e1" />
  </g>

  <!-- Paper Header Banner (Blue Accent) -->
  <rect x="18" y="13" width="15" height="3" rx="1.5" fill="#2563eb" />

  <!-- Exam Paper Question Lines -->
  <rect x="18" y="20" width="22" height="2" rx="1" fill="#94a3b8" />
  <rect x="18" y="25" width="18" height="2" rx="1" fill="#cbd5e1" />
  <rect x="18" y="30" width="20" height="2" rx="1" fill="#94a3b8" />
  <rect x="18" y="35" width="14" height="2" rx="1" fill="#cbd5e1" />

  <!-- Verified Badge / Checkmark Circle (Emerald Green) -->
  <circle cx="24" cy="43" r="5" fill="#10b981" />
  <!-- Checkmark -->
  <path d="M 21.5 43 L 23.2 44.7 L 26.5 41.2" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-Gloss Professional Exam Pencil/Pen (Angled across bottom-right) -->
  <g transform="rotate(-38 43 41)">
    <!-- Pen Body -->
    <rect x="39" y="24" width="7" height="22" rx="1.5" fill="url(#goldGrad)" />
    <!-- Pen Grip Lines -->
    <rect x="39" y="38" width="7" height="1.5" fill="#b45309" />
    <rect x="39" y="41" width="7" height="1.5" fill="#b45309" />
    <!-- Pen Tip Cone -->
    <path d="M 39 46 L 42.5 53 L 46 46 Z" fill="#e2e8f0" />
    <!-- Pen Nib Point -->
    <path d="M 41.5 50.5 L 42.5 53 L 43.5 50.5 Z" fill="#0f172a" />
    <!-- Pen Eraser/Top Cap -->
    <rect x="39" y="21" width="7" height="3" rx="1" fill="#ef4444" />
    <rect x="39" y="23.5" width="7" height="1.5" fill="#e2e8f0" />
  </g>

  <!-- Mini Star Badge on Top (Academic Excellence) -->
  <path d="M 52 7 L 53 10 L 56 10 L 53.5 12 L 54.5 15 L 52 13 L 49.5 15 L 50.5 12 L 48 10 L 51 10 Z" fill="url(#goldGrad)" />
</svg>