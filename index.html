<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Pro Test Maker | پاکستان کا جدید امتحانی و ٹیسٹ جنریٹر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Noto+Nastaliq+Urdu:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" href="/fonts/JameelNooriNastaleeqRegular.woff" as="font" type="font/woff" crossorigin>
    <style>
      body { margin: 0; background-color: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
      @keyframes ptmPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.08); } }
      @keyframes ptmSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes ptmBar { 0% { width: 10%; } 50% { width: 65%; } 100% { width: 95%; } }
      .ptm-preloader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #172554 0%, #0b1120 60%, #050811 100%); color: #fff; z-index: 9999; }
      .ptm-glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: rgba(59, 130, 246, 0.25); filter: blur(60px); animation: ptmPulse 3s infinite ease-in-out; pointer-events: none; }
      .ptm-box { position: relative; z-index: 1; padding: 28px 32px; border-radius: 24px; background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px); text-align: center; max-width: 340px; width: 85%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
      .ptm-emblem { position: relative; width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(135deg, #2563eb, #4f46e5, #06b6d4); padding: 2px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
      .ptm-emblem-inner { width: 100%; height: 100%; border-radius: 16px; background: #0b1329; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; letter-spacing: -0.5px; }
      .ptm-title { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; margin: 0; color: #ffffff; }
      .ptm-sub { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; margin-top: 3px; }
      .ptm-urdu { font-size: 11px; color: #94a3b8; margin-top: 6px; }
      .ptm-bar-bg { width: 100%; height: 6px; border-radius: 9999px; background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(51, 65, 85, 0.8); overflow: hidden; margin-top: 18px; padding: 1px; }
      .ptm-bar-fill { height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981); animation: ptmBar 1.8s infinite ease-in-out; }
      .ptm-status { font-size: 10px; font-weight: 700; color: #64748b; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ptm-preloader">
        <div class="ptm-glow"></div>
        <div class="ptm-box">
          <div class="ptm-emblem">
            <div class="ptm-emblem-inner">
              <span style="font-size: 20px; color: #fff;">PTM</span>
              <span style="font-size: 7px; color: #38bdf8; letter-spacing: 1px; margin-top: -2px;">PRO</span>
            </div>
          </div>
          <div class="ptm-title">PRO TEST MAKER</div>
          <div class="ptm-sub">Examination & Assessment Hub</div>
          <div class="ptm-urdu">امتحانی پیپرز جنریٹر • پاکستان ایڈیشن</div>
          <div class="ptm-bar-bg">
            <div class="ptm-bar-fill"></div>
          </div>
          <div class="ptm-status">Starting Engine & Loading Syllabi...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
